spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# No secrets are stored here. Set JWT_SECRET to a Base64 string of at least 32 bytes,
# otherwise a random key is generated on every start.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Optional first admin, registration only ever creates regular users.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
